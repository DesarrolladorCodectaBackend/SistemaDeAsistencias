name: SistemaAsistencia

services:
  app:
    build:
      context: .
      dockerfile: build/Dockerfile
    container_name: laravel-app
    ports:
      - "8015:80"
    volumes:
      - .:/var/www
    networks:
      - laravel_net
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    ports:
      - "3311:3306"
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-laravel_db}
      - MYSQL_USER=${DB_USERNAME:-laravel_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-laravel_pass}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-laravel_pass}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel_net

networks:
  laravel_net:
    driver: bridge

volumes:
  db_data:
